<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="คลังความรู้ กลุ่มสาระวิทยาศาสตร์และเทคโนโลยี โรงเรียนสตรีวิทยา — บทความ ใบความรู้ และนวัตกรรมจากครู">
<meta property="og:title" content="คลังความรู้ · สตรีวิทยาศาสตร์ SW SciTech">
<meta property="og:description" content="บทความ ใบความรู้ และนวัตกรรมจากครูกลุ่มสาระวิทยาศาสตร์และเทคโนโลยี โรงเรียนสตรีวิทยา เรียนได้ฟรี">
<meta property="og:image" content="https://kp-science.github.io/satriwit-science/og.jpg">
<meta property="og:url" content="https://kp-science.github.io/satriwit-science/knowledge/">
<meta property="og:type" content="website">

<link rel="icon" type="image/png" sizes="64x64" href="https://kp-science.github.io/satriwit-science/img/favicon-64.png">
<link rel="apple-touch-icon" href="https://kp-science.github.io/satriwit-science/img/apple-touch-icon.png">
<title>คลังความรู้ · สตรีวิทยาศาสตร์ SW SciTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700;800&family=Prompt:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  :root{
    --paper:#ffffff; --paper-2:#f0f1f3; --card:#ffffff;
    --ink:#1f2328; --ink-2:#4b5159; --muted:#8a9099; --rule:#d9dce1;
    --silver:linear-gradient(100deg,#5a5f67 0%,#b3b8bf 22%,#757b83 40%,#d9dce0 55%,#858b93 72%,#50555c 100%);
    --g-cool:linear-gradient(90deg,#4f46e5,#0891b2 45%,#10b981);
    --g-warm:linear-gradient(90deg,#7c3aed,#db2777 50%,#f97316);
    --g-all:linear-gradient(90deg,#4f46e5,#0891b2,#10b981,#eab308,#f97316,#db2777,#7c3aed,#4f46e5);
    --serif:'Noto Serif Thai',Georgia,serif; --label:'Prompt',system-ui,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;color:var(--ink);font:17px/1.7 'Sarabun',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    background:radial-gradient(55% 45% at 100% 0%,rgba(99,102,241,.10),transparent 70%),radial-gradient(45% 40% at 0% 35%,rgba(16,185,129,.08),transparent 70%),radial-gradient(50% 40% at 100% 75%,rgba(249,115,22,.07),transparent 70%),#fff;background-attachment:fixed}
  a{color:inherit}
  button{font:inherit;color:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}
  .hide{display:none!important}

  /* ---------- แถบบน ---------- */
  .bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ink)}
  .bar::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:3px;background:var(--g-all);background-size:200% 100%;animation:flow 10s linear infinite}
  @keyframes flow{to{background-position:200% 0}}
  .bar .wrap{display:flex;align-items:center;gap:14px;height:60px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand img{height:30px;width:auto}
  .brand b{font:800 22px var(--serif)}
  .brand span{font:500 13px var(--label);color:var(--muted);letter-spacing:.04em;border-left:1px solid var(--rule);padding-left:10px}
  .bar nav{margin-left:auto;display:flex;gap:18px;font:500 14px var(--label)}
  .bar nav a{text-decoration:none}
  .bar nav a:hover{text-decoration:underline}

  /* ---------- ปุ่ม ---------- */
  .btn{display:inline-flex;align-items:center;gap:8px;font:500 15px var(--label);padding:11px 20px;border:1.5px solid var(--ink);background:#fff;text-decoration:none;cursor:pointer;position:relative;overflow:hidden;z-index:0;transition:color .35s}
  .btn::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .4s cubic-bezier(.7,0,.2,1);z-index:-1}
  .btn:hover{color:#fff}.btn:hover::before{transform:none}
  .btn.solid{background:var(--ink);color:#fff}.btn.solid::before{background:#4f46e5}
  .btn.sm{padding:6px 12px;font-size:13px;border-width:1px}

  /* ---------- หัวหน้า ---------- */
  .hero{padding:56px 0 30px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:end;border-bottom:4px double var(--ink)}
  .kick{font:600 13px var(--label);letter-spacing:.16em;background:var(--g-warm);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero h1{font:800 clamp(52px,9vw,124px)/1.1 var(--serif);margin:6px 0 10px;letter-spacing:-.02em;background:var(--silver);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s linear infinite;filter:drop-shadow(0 1px 0 #fff) drop-shadow(0 2px 2px rgba(31,35,40,.16))}
  @keyframes shine{to{background-position:300% 0}}
  .hero p{margin:0;color:var(--ink-2);max-width:560px}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);background:#fff}
  .nums div{padding:14px 12px;border-left:1px solid var(--rule);text-align:center}
  .nums div:first-child{border-left:0}
  .nums b{display:block;font:800 40px/1.1 var(--serif);background:var(--g-cool);-webkit-background-clip:text;background-clip:text;color:transparent}
  .nums span{font:500 13px var(--label);color:var(--ink-2)}

  /* ---------- ประเภท + ตัวกรอง ---------- */
  .types{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0 18px}
  .ty{border:1px solid var(--rule);background:#fff;padding:14px 16px;cursor:pointer;text-align:left;position:relative;display:flex;gap:12px;align-items:center;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s}
  .ty:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(31,35,40,.07)}
  .ty.on{border-color:var(--ink)}
  .ty.on::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-1px;height:3px;background:var(--g-cool)}
  .ty .ic{width:40px;height:40px;display:grid;place-items:center;background:var(--paper-2);flex:none}
  .ty.on .ic{background:var(--ink);color:#fff}
  .ty b{display:block;font:600 16px/1.3 var(--label)}
  .ty small{font:400 13px var(--label);color:var(--muted)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:28px;font:500 14px var(--label)}
  .filters .lab{color:var(--muted);margin-right:2px}
  .chip{border:1px solid var(--rule);background:#fff;padding:4px 13px;border-radius:99px;cursor:pointer;font:inherit;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .kdot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));flex:none}
  .filters .gap{width:14px}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--ink);padding:2px 2px 4px;min-width:240px}
  .search input{border:0;outline:0;background:transparent;font:400 15px 'Sarabun';flex:1;min-width:0}

  /* ---------- การ์ด (ใช้ทั้งหน้านี้และหน้าแรก) ---------- */
  .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;grid-auto-flow:dense}
  .kc{display:flex;flex-direction:column;background:#fff;border:1px solid var(--ink);text-decoration:none;position:relative;transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
  .kc:hover{transform:translateY(-4px);box-shadow:8px 8px 0 #d6d9de}
  .kc-cv{position:relative;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,var(--a),var(--b));border-bottom:1px solid var(--ink)}
  .kc-cv img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
  .kc-cv img.ok{opacity:1}
  .kc-art{position:absolute;inset:0;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:16px}
  .kc-art em{font:600 12px var(--label);letter-spacing:.14em;font-style:normal;opacity:.85}
  .kc-art svg{width:84px;height:84px;opacity:.35;margin:-6px -6px 0 0}
  .kc-art::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 90% at 85% 10%,rgba(255,255,255,.28),transparent 60%)}
  .kc.t-sheet .kc-cv{background:var(--paper-2)}
  .paper{position:absolute;left:50%;top:16px;bottom:-30px;width:46%;transform:translateX(-50%) rotate(-3deg);background:#fff;border:1px solid var(--rule);box-shadow:6px 6px 0 rgba(31,35,40,.08);padding:16px 14px;transition:transform .5s var(--ease)}
  .kc:hover .paper{transform:translateX(-50%) rotate(0) translateY(-6px)}
  .paper::before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--a),var(--b));margin-bottom:10px}
  .paper i{display:block;height:5px;background:var(--paper-2);margin:7px 0}
  .paper i:nth-child(2n){width:78%}
  .paper b{display:block;font:700 11px/1.35 var(--serif);color:var(--ink);margin-bottom:6px;max-height:3em;overflow:hidden}
  .kc-type{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:6px;font:600 11px var(--label);letter-spacing:.06em;background:rgba(31,35,40,.82);color:#fff;padding:3px 9px 3px 7px;z-index:1}
  .kc-type svg{width:13px;height:13px}
  .kc-lv{position:absolute;right:12px;top:12px;font:600 11px var(--label);background:#fff;color:var(--ink);padding:3px 9px;z-index:1;border:1px solid var(--ink)}
  .kc-bd{padding:15px 17px 17px;display:flex;flex-direction:column;gap:6px;flex:1}
  .kc-sub{display:inline-flex;align-items:center;gap:7px;font:500 12px var(--label);color:var(--ink-2)}
  .kc h3{font:700 19px/1.45 var(--serif);margin:0}
  .kc p{margin:0;font-size:15px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .kc-meta{font:400 13px var(--label);color:var(--muted);margin-top:auto;padding-top:8px}
  .kc-go{font:600 14px var(--label);display:inline-flex;gap:6px;align-items:center;align-self:flex-start;border-bottom:2px solid;padding-bottom:1px}
  .kc-go svg{transition:transform .35s var(--ease)}
  .kc:hover .kc-go svg{transform:translateX(4px)}
  .kc-res{align-self:flex-start;font:600 12px var(--label);background:#ecfdf5;color:#047857;padding:3px 9px}
  .kc-pin{position:absolute;right:-1px;bottom:-1px;font:600 11px var(--label);background:var(--g-warm);color:#fff;padding:2px 9px}
  /* นวัตกรรม: การ์ดกว้าง 2 ช่อง */
  .kgrid.wide .kc.t-inno{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr}
  .kgrid.wide .kc.t-inno .kc-cv{aspect-ratio:auto;min-height:100%;border-bottom:0;border-right:1px solid var(--ink)}
  .empty{color:var(--muted);padding:40px;text-align:center;border:1px dashed var(--rule);grid-column:1/-1}
  .more{display:flex;justify-content:center;margin-top:30px}

  /* ---------- หน้าอ่าน ---------- */
  .view{padding:34px 0 40px}
  .back{display:inline-flex;align-items:center;gap:6px;font:500 14px var(--label);text-decoration:none;color:var(--ink-2);margin-bottom:22px;cursor:pointer;background:none;border:0;padding:0}
  .back:hover{color:var(--ink)}
  .rd-head{max-width:820px}
  .rd-tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:500 13px var(--label)}
  .tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--rule);background:#fff}
  .tag.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rd-head h1{font:800 clamp(32px,4.6vw,56px)/1.3 var(--serif);margin:14px 0 10px;letter-spacing:-.01em}
  .lede{font-size:20px;line-height:1.75;color:var(--ink-2);margin:0 0 14px}
  .byline{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font:400 14px var(--label);color:var(--muted);padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .byline b{color:var(--ink);font-weight:500}
  .byline .sp{flex:1}
  .share{border:1px solid var(--rule);background:#fff;padding:4px 12px;cursor:pointer;font:500 13px var(--label)}
  .share:hover{border-color:var(--ink)}
  .rd-cover{margin:26px 0 10px;border:1px solid var(--ink);background:var(--paper-2)}
  .rd-cover img{width:100%;max-height:520px;object-fit:cover;display:block}
  .rd-body{display:grid;grid-template-columns:minmax(0,760px) 1fr;gap:48px;margin-top:26px}
  .rd-side{position:sticky;top:90px;align-self:start;display:flex;flex-direction:column;gap:14px}
  .box{border:1px solid var(--ink);background:#fff;padding:18px}
  .box h4{margin:0 0 8px;font:600 13px var(--label);letter-spacing:.08em;color:var(--muted)}
  .box .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--rule);font-size:15px}
  .box .row:last-child{border-bottom:0}
  .box .row span{color:var(--muted)}
  .box .btn{width:100%;justify-content:center;margin-top:8px}
  .result{position:relative;padding:20px 20px 18px;color:#fff;background:linear-gradient(135deg,#047857,#0891b2);border:1px solid var(--ink)}
  .result small{font:600 12px var(--label);letter-spacing:.1em;opacity:.85}
  .result b{display:block;font:700 22px/1.45 var(--serif);margin-top:4px}

  /* เนื้อหาบทความ */
  .prose{font-size:18.5px;line-height:1.95;min-width:0}
  .prose>*:first-child{margin-top:0}
  .prose p{margin:0 0 1.1em}
  .prose h2{font:700 28px/1.4 var(--serif);margin:1.6em 0 .5em;padding-top:.4em;border-top:1px solid var(--rule)}
  .prose h3{font:700 22px/1.45 var(--serif);margin:1.4em 0 .4em}
  .prose ul,.prose ol{margin:0 0 1.1em;padding-left:1.4em}
  .prose li{margin:.25em 0}
  .prose li::marker{color:#4f46e5;font-weight:700}
  .prose blockquote{margin:1.4em 0;padding:16px 20px;background:var(--paper-2);border-left:4px solid;border-image:var(--g-cool) 1;font-size:17.5px}
  .prose figure{margin:1.6em 0}
  .prose figure img{width:100%;display:block;border:1px solid var(--rule);background:var(--paper-2);min-height:80px}
  .prose figcaption{font:400 14px var(--label);color:var(--muted);margin-top:8px;text-align:center}
  .prose a{color:#4338ca;text-underline-offset:3px;word-break:break-word}
  .prose .math{overflow-x:auto;margin:1.2em 0;text-align:center}
  .embed{position:relative;margin:1.6em 0;border:1px solid var(--ink);background:#000}
  .embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .embed.v{aspect-ratio:16/9}
  .embed.doc{aspect-ratio:3/4;max-height:85vh;background:var(--paper-2)}
  .embed.web{aspect-ratio:4/3;background:#fff}
  .embed-cap{display:flex;justify-content:flex-end;font:500 13px var(--label);margin:-1.3em 0 1.6em}
  .lbtn{display:inline-flex;align-items:center;gap:8px;margin:.3em 0 1em;padding:10px 18px;border:1.5px solid var(--ink);font:500 15px var(--label);text-decoration:none!important;color:var(--ink)!important;background:#fff}
  .lbtn:hover{background:var(--ink);color:#fff!important}

  /* ใบความรู้ */
  .doc-view{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;margin-top:26px}
  .doc-view .embed.doc{margin:0;aspect-ratio:auto;height:min(1040px,82vh);max-height:none}
  .nofile{border:1px dashed var(--rule);padding:60px 20px;text-align:center;color:var(--muted)}

  .related{margin-top:60px;border-top:4px double var(--ink);padding-top:18px}
  .related h3{font:800 28px var(--serif);margin:0 0 18px}
  .skel{height:18px;background:linear-gradient(90deg,var(--paper-2),#fafafa,var(--paper-2));background-size:200% 100%;animation:sk 1.2s linear infinite;margin:12px 0}
  @keyframes sk{to{background-position:-200% 0}}

  footer{margin-top:70px;background:var(--ink);color:#fff;padding:36px 0}
  footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
  footer b{font:800 30px var(--serif);background:var(--silver);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s linear infinite}
  footer p{margin:0;opacity:.7;font-size:14px}
  footer a{color:#fff}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--ink);color:#fff;padding:10px 18px;font:500 15px var(--label);transition:.3s;z-index:60;opacity:0}
  .toast.show{transform:translate(-50%,0);opacity:1}

  .rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0s)}
  .rv.in{opacity:1;transform:none}

  @media (max-width:980px){
    .hero{grid-template-columns:1fr;gap:22px}
    .types{grid-template-columns:repeat(2,1fr)}
    .rd-body,.doc-view{grid-template-columns:1fr}
    .rd-side{position:static}
    .kgrid.wide .kc.t-inno{grid-column:auto;display:flex}
    .kgrid.wide .kc.t-inno .kc-cv{aspect-ratio:16/9;border-right:0;border-bottom:1px solid var(--ink)}
  }
  @media (max-width:640px){
    .wrap{padding:0 16px}
    .brand span{display:none}
    .brand b{font-size:19px;white-space:nowrap}
    .bar nav{gap:14px;font-size:14px;white-space:nowrap}
    .bar nav a:first-child{display:none}
    .types{grid-template-columns:1fr 1fr;gap:8px}
    .ty{padding:10px 12px;gap:10px}
    .ty .ic{width:34px;height:34px}
    .ty small{display:none}
    .types .ty:first-child{grid-column:1/-1}
    .nums b{font-size:30px}
    .search{min-width:0;width:100%;margin-left:0}
    .lede{font-size:18px}
    .prose{font-size:17.5px}
    .doc-view .embed.doc{height:70vh}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

</div></header>

<main class="wrap" id="app"><div class="view"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div></main>

<script>window.PUBLIC_API = 'https://script.google.com/macros/s/AKfycbyrqfQLt_V9rwiTS70ka8baRuUa6HsUCjqF3TvZHimhCMuesOSXGrTKdrGnkUyJ2fWjzA/exec'; window.ADMIN_URL = 'https://script.google.com/a/macros/satriwit.ac.th/s/AKfycbzF2RA9Ptfpvwy8dVTVa-JzhcyYzA-JZnYeiG-x2Hcbge9dLEN2Kuj3sWdgB8sP-eeaFA/exec';</script>
<script>
(function () {
/* ===================== ค่าคงที่ ===================== */
const TYPES = [
  { name: 'ความรู้', key: 'read', go: 'อ่านต่อ', desc: 'บทความอ่านสั้น' },
  { name: 'ใบความรู้', key: 'sheet', go: 'เปิดใบความรู้', desc: 'PDF อ่าน/ดาวน์โหลด' },

const imgCache = {};
const IMG_PREFIX = 'swimg_';
function storeGet(id) { try { return localStorage.getItem(IMG_PREFIX + id); } catch (e) { return null; } }
function storePut(id, d) { try { localStorage.setItem(IMG_PREFIX + id, d); } catch (e) { /* เต็ม ข้าม */ } }
function fetchImage(img) {
  const id = img.dataset.img, show = s => { if (s) { img.src = s; img.classList.add('ok'); } };
  if (imgCache[id]) return show(imgCache[id]);
  const saved = storeGet(id); if (saved) { imgCache[id] = saved; return show(saved); }
  api('apiImage', id).then(s => { if (!s) return; imgCache[id] = s; storePut(id, s); show(s); }).catch(() => {});
}
function loadImages(root) {
  const imgs = [...(root || document).querySelectorAll('img[data-img]:not(.ok)')];
  if (!('IntersectionObserver' in window)) return imgs.forEach(fetchImage);
  const ob = new IntersectionObserver((es, o) => es.forEach(e => { if (e.isIntersecting) { o.unobserve(e.target); fetchImage(e.target); } }), { rootMargin: '500px 0px' });
  imgs.forEach(i => ob.observe(i));
}

/* ===================== แปลงเนื้อหา =====================
   ## หัวข้อ · ### หัวข้อย่อย · - รายการ · 1. รายการ · > กล่องเน้น · **ตัวหนา** · $สมการ$ · $$สมการ$$
   [รูป: รหัสรูป/ลิงก์ | คำบรรยาย] · [คลิป: ลิงก์ YouTube] · [PDF: ลิงก์ Drive] · [ฝัง: ลิงก์หน้าเว็บ] · [ลิงก์: ข้อความ | ลิงก์]
   บรรทัดที่มีแต่ลิงก์ YouTube จะกลายเป็นคลิปให้เอง */
const ytId = u => { const m = /(?:youtu\.be[/]|youtube\.com[/](?:watch\?(?:.*&)?v=|embed[/]|shorts[/]|live[/]))([\w-]{11})/.exec(u || ''); return m ? m[1] : ''; };
const driveId = u => { const m = /drive\.google\.com[/](?:file[/]d[/]|open\?id=|uc\?(?:.*&)?id=)([\w-]{20,})/.exec(u || ''); return m ? m[1] : ''; };
function embedSrc(u) {
  u = safeUrl(u); if (!u) return '';
  const y = ytId(u); if (y) return 'https:\/\/www.youtube-nocookie.com/embed/' + y;
  const d = driveId(u); if (d) return 'https:\/\/drive.google.com/file/d/' + d + '/preview';
  const g = /docs\.google\.com[/](presentation|document|spreadsheets|forms)[/]d[/](e[/])?([\w-]{20,})/.exec(u);
  if (g) return g[1] === 'presentation' ? u.replace(/[/](edit|pub|view)\b.*$/, '') + '/embed' : g[1] === 'forms' ? u.replace(/[/](edit|viewform)\b.*$/, '') + '/viewform?embedded=true' : u.replace(/[/](edit|view|pub)\b.*$/, '') + '/preview';
  return u;
}
const imgSrc = s => {
  s = String(s || '').trim();
  if (/^[-\w]{20,}$/.test(s)) return { id: s };
  const d = driveId(s); if (d) return { url: 'https:\/\/drive.google.com/thumbnail?id=' + d + '&sz=w1600' };
  return { url: safeUrl(s) };
};
const inline = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
  .replace(/(^|[\s(])(https?:[/][/][^\s<]+)/g, (m, a, u) => `${a}<a href="${u}" target="_blank" rel="noopener">${u.length > 60 ? u.slice(0, 57) + '…' : u}</a>`);
function block(kind, arg) {
  const [a, b] = String(arg).split('|').map(x => x.trim());
  kind = kind.toLowerCase();
  if (kind === 'รูป') {
    const s = imgSrc(a); if (!s.id && !s.url) return '';
    return `<figure>${s.id ? `<img data-img="${esc(s.id)}" alt="${esc(b || '')}">` : `<img src="${esc(s.url)}" alt="${esc(b || '')}" loading="lazy">`}${b ? `<figcaption>${esc(b)}</figcaption>` : ''}</figure>`;
  }
  if (kind === 'ลิงก์') {
    const url = safeUrl(b || a); if (!url) return '';
    return `<p><a class="lbtn" href="${esc(url)}" target="_blank" rel="noopener">${esc(b ? a : 'เปิดลิงก์')} ${ICON.out}</a></p>`;
  }
  const src = embedSrc(a); if (!src) return '';
  const cls = ytId(a) ? 'v' : (driveId(a) || /docs\.google\.com/.test(a)) ? 'doc' : 'web';
  return `<div class="embed ${cls}"><iframe src="${esc(src)}" loading="lazy" allow="fullscreen; encrypted-media; picture-in-picture" allowfullscreen title="${esc(b || kind)}"></iframe></div>`
    + (cls === 'v' ? '' : `<div class="embed-cap"><a href="${esc(safeUrl(a))}" target="_blank" rel="noopener">${esc(b || 'เปิดในแท็บใหม่')} ${ICON.out}</a></div>`);
}
function renderBody(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  let html = '', para = [], list = null, math = null;
  const flushP = () => { if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
  const flushL = () => {
    if (!list) return;
    html += list.tag === 'blockquote' ? `<blockquote>${list.items.map(inline).join('<br>')}</blockquote>`
      : `<${list.tag}>${list.items.map(x => '<li>' + inline(x) + '</li>').join('')}</${list.tag}>`;
    list = null;
  };
  const flush = () => { flushP(); flushL(); };
  const into = (tag, x) => { flushP(); if (!list || list.tag !== tag) { flushL(); list = { tag, items: [] }; } list.items.push(x); };
  for (const raw of lines) {
    const line = raw.trim();
    if (math) { math.push(line); if (line.endsWith('$$')) { html += `<div class="math">${esc(math.join('\n'))}</div>`; math = null; } continue; }
    if (!line) { flush(); continue; }
    if (line.startsWith('$$')) { flush(); if (line.length > 4 && line.endsWith('$$')) html += `<div class="math">${esc(line)}</div>`; else math = [line]; continue; }
    let m;
    if ((m = /^(#{2,3})\s*(.+)$/.exec(line))) { flush(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if ((m = /^>\s?(.*)$/.exec(line))) { into('blockquote', m[1]); continue; }
    if ((m = /^[-•*]\s+(.+)$/.exec(line))) { into('ul', m[1]); continue; }
    if ((m = /^\d+[.)]\s+(.+)$/.exec(line))) { into('ol', m[1]); continue; }
    if ((m = /^\[\s*(รูป|คลิป|PDF|ไฟล์|ฝัง|ลิงก์)\s*:\s*(.+)\]$/i.exec(line))) { flush(); html += block(m[1], m[2]); continue; }
    if (/^https?:\S+$/.test(line) && ytId(line)) { flush(); html += block('คลิป', line); continue; }
    flushL(); para.push(line);
  }
  if (math) html += `<div class="math">${esc(math.join('\n'))}</div>`;
  flush();
  return html;
}
function typeset(el) {
  const run = () => window.renderMathInElement && renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }, { left: '\\(', right: '\\)', display: false }], throwOnError: false });
  if (window.renderMathInElement) run(); else addEventListener('load', run, { once: true });
}

  <div class="row"><span>ระดับชั้น</span>${esc(k.level || 'ทุกระดับ')}</div>${k.author ? `<div class="row"><span>ผู้จัดทำ</span>${esc(k.author)}</div>` : ''}</div>`;
function viewRead(k) {
  const url = safeUrl(k.url);
  return `${head(k)}${cover(k)}<div class="rd-body"><div class="prose">${renderBody(k.body) || '<p style="color:var(--muted)">ยังไม่มีเนื้อหา</p>'}
    ${url ? `<p><a class="lbtn" href="${esc(url)}" target="_blank" rel="noopener">${esc(k.urlLabel || 'อ่านเพิ่มเติม')} ${ICON.out}</a></p>` : ''}</div>
    <aside class="rd-side">${sideInfo(k)}</aside></div>`;
}
function viewSheet(k) {
  const url = safeUrl(k.url), d = driveId(url), src = embedSrc(url);
  return `${head(k)}<div class="doc-view">
    <div>${src ? `<div class="embed doc"><iframe src="${esc(src)}" loading="lazy" allowfullscreen title="${esc(k.title)}"></iframe></div>` : '<div class="nofile">ยังไม่มีไฟล์ใบความรู้</div>'}
      ${k.body ? `<div class="prose" style="margin-top:28px">${renderBody(k.body)}</div>` : ''}</div>
    <aside class="rd-side">
      ${url ? `<div class="box"><h4>ใบความรู้</h4>
        ${d ? `<a class="btn solid" href="https:\/\/drive.google.com/uc?export=download&id=${esc(d)}" target="_blank" rel="noopener">${ICON.down} ดาวน์โหลด PDF</a>` : ''}
        <a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${esc(k.urlLabel || 'เปิดในแท็บใหม่')} ${ICON.out}</a></div>` : ''}
      ${sideInfo(k)}</aside></div>`;
}
function viewInno(k) {
  const url = safeUrl(k.url);
  return `${head(k)}${cover(k)}<div class="rd-body"><div class="prose">${renderBody(k.body) || ''}</div>
    <aside class="rd-side">
      ${k.extra ? `<div class="result"><small>ผลการใช้</small><b>${esc(k.extra)}</b></div>` : ''}
      ${url ? `<div class="box"><h4>ใช้งานนวัตกรรม</h4><a class="btn solid" href="${esc(url)}" target="_blank" rel="noopener">${esc(k.urlLabel || 'ลองใช้เลย')} ${ICON.out}</a></div>` : ''}
      ${sideInfo(k)}</aside></div>`;
}

function related(k) {
  const list = state.list.filter(x => x.id !== k.id && (x.subject === k.subject || x.type === k.type))
    .sort((a, b) => (b.subject === k.subject) - (a.subject === k.subject) || byNew(a, b)).slice(0, 3);
  return list.length ? `<section class="related"><h3>อ่าน/เรียนต่อ</h3><div class="kgrid">${list.map(card).join('')}</div></section>` : '';
}

document.addEventListener('click', e => {
  if (e.target.closest('[data-back]')) { location.hash = state.type ? '#/t/' + encodeURIComponent(state.type) : '#/'; return; }
  if (e.target.closest('[data-share]')) {
    const u = location.href;
    (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('คัดลอกลิงก์แล้ว'), () => prompt('คัดลอกลิงก์นี้', u));
  }
});

/* ---------- เส้นทาง: #/  ·  #/t/ประเภท  ·  #/k/รหัส  ·  #/k/รหัส/บทที่ ---------- */
let lastKey = '';
function route(keepScroll) {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  const m = /^[/]k[/]([^/]+)(?:[/](\d+))?/.exec(h);
  const key = m ? 'k' + m[1] + '/' + (m[2] || '') : 'list';
  if (m) renderItem(m[1], m[2]);
  else {
    const t = /^[/]t[/](.+)$/.exec(h);
    state.type = t && TYPES.some(x => x.name === t[1]) ? t[1] : (h.startsWith('/t/') ? '' : state.type);
    if (!h || h === '/') state.type = '';
    document.title = 'คลังความรู้ · สตรีวิทยาศาสตร์ SW SciTech';
    renderList();
  }
  if (!keepScroll && key !== lastKey) scrollTo(0, 0);
  lastKey = key;
}
addEventListener('hashchange', () => route());

const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .08 }) : null;
function reveal() { document.querySelectorAll('.rv:not(.in)').forEach(el => io ? io.observe(el) : el.classList.add('in')); }

/* ===================== เริ่มต้น ===================== */
if (window.ADMIN_URL) { $('submitLink').href = window.ADMIN_URL; $('submitLink').classList.remove('hide'); }
const DATA_KEY = 'swst_data_v1';
try { const saved = JSON.parse(localStorage.getItem(DATA_KEY) || 'null'); if (saved && saved.knowledge) state.list = saved.knowledge; } catch (e) { /* ข้าม */ }
route();
api('apiInit').then(r => {
  try { localStorage.setItem(DATA_KEY, JSON.stringify(r)); } catch (e) { /* ข้าม */ }
  const changed = JSON.stringify(r.knowledge || []) !== JSON.stringify(state.list);
  state.list = r.knowledge || []; state.loaded = true;
  if (changed || !/^#[/]k[/]/.test(location.hash)) route(true);
}).catch(err => { state.loaded = true; if (!/^#[/]k[/]/.test(location.hash)) $('grid') && ($('grid').innerHTML = `<div class="empty">โหลดข้อมูลไม่ได้: ${esc(err.message || err)}</div>`); });
})();
</script>
</body>
</html>
